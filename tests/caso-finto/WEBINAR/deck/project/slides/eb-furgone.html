<section id="eb-furgone" style="background:#FAFAF7;color:#1A1A1A;font-family:Poppins, Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:40px;justify-content:flex-start"><h2 style="font-size:64px;font-weight:800;line-height:1.1">Il <span style="color:#1F6FEB">furgone</span></h2><p style="font-size:40px;line-height:1.4;width:1500px">Dopo il concerto, nel furgone, il capobanda mi dice una frase che mi è rimasta addosso per anni:<br><br><b>"In studio sei un orologio. Sul palco sei un'altra persona."</b></p><aside>FONTE: intake §1.1. Frase di un terzo senza nome: consenso chiesto (scheda §8, L4).</aside></section>
