<section id="f1-apertura" style="background:#FAFAF7;color:#1A1A1A;font-family:Poppins, Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:40px;justify-content:flex-start"><h2 style="font-size:64px;font-weight:800;line-height:1.1">Fase 1 · La <span style="color:#1F6FEB">camera</span></h2><p style="font-size:40px;line-height:1.4;width:1500px">Il primo "sì, ma" è questo.<br><br>"Ok, Fabrizio. Ma il palco si impara sul palco. Cosa mi insegni da uno schermo?"<br><br>Ci sta. <b>Lo pensavo anch'io.</b></p><aside>FONTE: intake §2.1 obiez. 4 (credenza sul veicolo), detta con le parole di chi guarda (F11). Architettura A: fase 1 → veicolo.</aside></section>
